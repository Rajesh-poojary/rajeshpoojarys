<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d900ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1D2B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21223A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect width="100" height="100" rx="18" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.4"/>
  <!-- RP Text -->
  <text
    x="50" y="67"
    font-family="'Sora', 'Inter', Arial, sans-serif"
    font-size="46"
    font-weight="700"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#glow)"
    letter-spacing="-1">RP</text>
</svg>
